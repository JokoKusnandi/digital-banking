apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  labels:
    app: account-service
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: account-service
      spec:
        containers:
          - name: account-service
            image: banking/account-service:latest
            ports:
              - containerPort : 8082
            env : 
             - name : SPRING_DATASOURCE_URL
               value: jdbc:postgresql://postgres:5432/account_db
             - name : SPRING_KAFKA_BOOTSTRAP_SERVERS
               value: kafka:9092
             - name : SPRING_DATA_REDIS_HOST
               value: redis
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"

---
apiVersion: v1
kind : Service
metadata: 
  name: account-service
spec:
  selector:
    app: account-service
  ports:
    -port : 8082
    targetPort: 8082
  type: ClusterIP
