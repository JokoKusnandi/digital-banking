apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
  spec:
    replicas: 2
    selector:
      matchLabels:
        app: api-gateway
      spec:
        containers:
          - name: api-gateway
            image: banking/api-gateway:latest
            ports:
              - containerPort : 8080
            resources:
              requests:
                memory: "512Mi"
                cpu: "250m"
              limits:
                memory: "1Gi"
                cpu: "500m"

---
apiVersion: v1
kind : Service
metadata: 
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
    -port : 8080
    targetPort: 8080
  type: ClusterIP
